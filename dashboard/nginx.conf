server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Cache ────────────────────────────────────────────────
    # O index.html referencia os bundles por nome com hash
    # (/assets/index-<hash>.js). index.html sempre revalida; assets com hash
    # no nome nunca precisam revalidar, porque conteudo novo tem nome novo.

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://zleilao-backend:8000/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Rotas do SPA caem todas no index.html. O no-cache vale para ele e para
    # qualquer arquivo servido daqui; os bundles ficam em /assets/, tratados
    # acima com cache longo.
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1000;
}
