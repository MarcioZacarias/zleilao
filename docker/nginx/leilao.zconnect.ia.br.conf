# =========================================================
# Nginx server block para leilao.zconnect.ia.br (subdominio A CONFIRMAR)
# ---------------------------------------------------------
# Instalacao no host (o nginx roda FORA do Docker, compartilhado com os demais):
#
#   sudo cp docker/nginx/leilao.zconnect.ia.br.conf /etc/nginx/sites-available/leilao.zconnect.ia.br
#   sudo ln -sf /etc/nginx/sites-available/leilao.zconnect.ia.br /etc/nginx/sites-enabled/leilao.zconnect.ia.br
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificado:
#   sudo certbot --nginx -d leilao.zconnect.ia.br --redirect --agree-tos \
#                --email marcio.zacarias@radconsult.com.br -n
#
# NAO use `certbot --standalone` (precisa da porta 80 e derruba os outros sites).
# =========================================================

server {
    listen 80;
    listen [::]:80;
    server_name leilao.zconnect.ia.br;

    client_max_body_size 10M;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # O container zleilao-dashboard serve o SPA e faz o proxy interno de
    # /api -> zleilao-backend:8000/v1. Aqui so' repassamos.
    location / {
        proxy_pass http://127.0.0.1:5177;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
    }
}
