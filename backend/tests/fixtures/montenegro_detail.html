<div id="app" data-page="{&quot;component&quot;:&quot;Lote&quot;,&quot;props&quot;:{&quot;errors&quot;:[],&quot;notify&quot;:{&quot;cor&quot;:null,&quot;icone&quot;:null,&quot;mensagem&quot;:null},&quot;dialog&quot;:{&quot;cor&quot;:null,&quot;titulo&quot;:null,&quot;mensagem&quot;:null},&quot;live&quot;:null,&quot;dominio_venda_direta_ativo&quot;:false,&quot;loteInit&quot;:{&quot;id&quot;:102565,&quot;id_status_lote&quot;:&quot;1&quot;,&quot;id_leilao&quot;:&quot;2627&quot;,&quot;tipo_lote&quot;:&quot;2&quot;,&quot;id_vistoria_bens_diversos&quot;:null,&quot;id_vistoria_veicular&quot;:&quot;49566&quot;,&quot;id_vistoria_imobiliaria&quot;:null,&quot;avaliacao_comitente&quot;:null,&quot;lance_inicial&quot;:&quot;3000&quot;,&quot;lance_minimo&quot;:&quot;3000&quot;,&quot;incremento&quot;:&quot;100&quot;,&quot;lance_inicial_segundo_leilao&quot;:null,&quot;lance_minimo_segundo_leilao&quot;:null,&quot;incremento_segundo_leilao&quot;:null,&quot;titulo&quot;:&quot;Yamaha Factor YBR125 E 2009\/2010&quot;,&quot;descricao&quot;:&quot;&lt;p&gt;&lt;strong&gt;15\u00aa Vara Criminal da Comarca de Fortaleza&lt;\/strong&gt;&lt;span style=\&quot;color:rgb(0,0,0);\&quot;&gt;&lt;strong&gt;\/CE&lt;\/strong&gt;&lt;\/span&gt;&lt;br&gt;&lt;span style=\&quot;color:rgb(0,0,0);\&quot;&gt;&lt;strong&gt;Processo: &lt;\/strong&gt;&lt;\/span&gt;0251626-92.2024.8.06.0001 (eSAJ).&lt;\/p&gt;&lt;hr&gt;&lt;p style=\&quot;margin-left:0px;\&quot;&gt;01 Motocicleta &lt;strong&gt;Yamaha\/Factor YBR125 E&lt;\/strong&gt;, Cor Vermelha, Ano Fab\/Modelo 2009\/2010.&lt;\/p&gt;&lt;p style=\&quot;margin-left:0px;\&quot;&gt;&lt;span style=\&quot;color:rgb(0,0,0);\&quot;&gt;&lt;strong&gt;Situa\u00e7\u00e3o:&amp;nbsp;&lt;\/strong&gt;&lt;\/span&gt;Ve\u00edculo regulariz\u00e1vel.&lt;\/p&gt;&lt;p style=\&quot;margin-left:0px;\&quot;&gt;&lt;span style=\&quot;color:rgb(0,0,0);\&quot;&gt;&lt;strong&gt;Localiza\u00e7\u00e3o:&amp;nbsp;&lt;\/strong&gt;Montenegro Leil\u00f5es&amp;nbsp;(Rua Ademar Paula, n\u00ba 1.000 \u2013 Esplanada do Castel\u00e3o. Fortaleza\/CE).&lt;\/span&gt;&lt;\/p&gt;&lt;hr&gt;&lt;p style=\&quot;margin-left:0px;\&quot;&gt;&lt;span style=\&quot;color:rgb(0,0,0);\&quot;&gt;&amp;nbsp;Ser\u00e1 acrescido ao valor arrematado, juntamente da comiss\u00e3o do LEILOEIRO (5%), os seguintes valores:&lt;\/span&gt;&lt;\/p&gt;&lt;p style=\&quot;margin-left:0px;\&quot;&gt;&lt;span style=\&quot;color:rgb(0,0,0);\&quot;&gt;- Ressarcimento de despesas com log\u00edstica no valor de&amp;nbsp;&lt;strong&gt;R$ 150,00.&lt;\/strong&gt;&lt;\/span&gt;&lt;\/p&gt;&lt;p style=\&quot;margin-left:0px;\&quot;&gt;&lt;span style=\&quot;color:rgb(0,0,0);\&quot;&gt;- Ressarcimento de despesas administrativas:&lt;\/span&gt;&lt;br&gt;&lt;br&gt;&lt;span style=\&quot;color:rgb(0,0,0);\&quot;&gt;&lt;strong&gt;R$ &lt;\/strong&gt;&lt;\/span&gt;&lt;strong&gt;360,00&lt;\/strong&gt;&lt;span style=\&quot;color:rgb(0,0,0);\&quot;&gt;&amp;nbsp;para motos;&lt;\/span&gt;&lt;br&gt;&lt;span style=\&quot;color:rgb(0,0,0);\&quot;&gt;&lt;strong&gt;R$ 68&lt;\/strong&gt;&lt;\/span&gt;&lt;strong&gt;0,00&lt;\/strong&gt;&lt;span style=\&quot;color:rgb(0,0,0);\&quot;&gt;&amp;nbsp;para &lt;\/span&gt;ve\u00edculos de pequeno e m\u00e9dio porte&lt;span style=\&quot;color:rgb(0,0,0);\&quot;&gt;;&lt;\/span&gt;&lt;br&gt;&lt;span style=\&quot;color:rgb(0,0,0);\&quot;&gt;&lt;strong&gt;R$ 1.600&lt;\/strong&gt;&lt;\/span&gt;&lt;strong&gt;,00&lt;\/strong&gt;&lt;span style=\&quot;color:rgb(0,0,0);\&quot;&gt;&amp;nbsp;&lt;\/span&gt;para ve\u00edculos de grande porte.&lt;br&gt;&lt;br&gt;&lt;span style=\&quot;color:rgb(0,0,0);\&quot;&gt;&lt;u&gt;O arremate de lotes de sucata somente poder\u00e1 ser realizado por empresas que possuam cadastro para comercializa\u00e7\u00e3o de pe\u00e7as usadas reguladas e\/ou que atendam \u00e0s exig\u00eancias legais pertinentes&lt;\/u&gt;&lt;\/span&gt;&lt;\/p&gt;&lt;p style=\&quot;margin-left:0px;\&quot;&gt;&lt;span style=\&quot;color:rgb(0,0,0);\&quot;&gt;&amp;nbsp;O Ju\u00edzo garantir\u00e1 ao arrematante a posse dos bens, livres de quaisquer \u00f4nus que possam existir sobre eles, anteriores a data de encerramento do leil\u00e3o, e que n\u00e3o estejam demonstrados no presente Edital.&lt;\/span&gt;&lt;\/p&gt;&lt;p style=\&quot;margin-left:0px;\&quot;&gt;&lt;span style=\&quot;color:rgb(0,0,0);\&quot;&gt;Al\u00e9m do valor pago referente ao lance vencedor, da comiss\u00e3o do leiloeiro e do relativo ao custo operacional (remo\u00e7\u00e3o, guarda e conserva\u00e7\u00e3o dos bens, etc.), n\u00e3o haver\u00e1 mais nenhum outro a incidir, estando as opera\u00e7\u00f5es de arremata\u00e7\u00e3o fora da \u00e1rea de incid\u00eancia de tributos federais, estaduais ou municipais, bem como as opera\u00e7\u00f5es de remessa das mesmas. A remo\u00e7\u00e3o do bem m\u00f3vel\/semovente arrematado ser\u00e1 de responsabilidade do pr\u00f3prio arrematante e correr\u00e1 por sua conta. No caso de bens automotores (ve\u00edculos, aeronaves, embarca\u00e7\u00f5es), o arrematante n\u00e3o arcar\u00e1 com os d\u00e9bitos de impostos sobre a propriedade, eventualmente existentes; nem com as multas pendentes, que s\u00e3o de responsabilidade pessoal do propriet\u00e1rio anterior; tanto que o juiz ordenar\u00e1 \u00e0 autoridade de tr\u00e2nsito ou ao equivalente \u00f3rg\u00e3o de registro e controle a expedi\u00e7\u00e3o de certificado de registro e licenciamento em favor do arrematante, sem responsabilidade nos referidos \u00f4nus; o arrematante arcar\u00e1, por\u00e9m, com as taxas relativas \u00e0 transfer\u00eancia do ve\u00edculo.&lt;\/span&gt;&lt;\/p&gt;&lt;p style=\&quot;margin-left:0px;\&quot;&gt;&lt;span style=\&quot;color:rgb(0,0,0);\&quot;&gt;&lt;i&gt;&lt;u&gt;OBS\u00b9:&amp;nbsp;O prazo para a realiza\u00e7\u00e3o da baixa de d\u00e9bitos anteriores \u00e0 data de arremata\u00e7\u00e3o, assim como o levantamento de gravames que porventura existam sobre o bem arrematado, depender\u00e1 do retorno dos \u00f3rg\u00e3os&amp;nbsp;respons\u00e1veis \u00e0 comunica\u00e7\u00e3o expedida pelo Magistrado, n\u00e3o podendo, portanto, ser precisado.&lt;\/u&gt;&lt;\/i&gt;&lt;\/span&gt;&lt;\/p&gt;&lt;p style=\&quot;margin-left:0px;\&quot;&gt;&lt;span style=\&quot;color:rgb(0,0,0);\&quot;&gt;&lt;i&gt;&lt;u&gt;OBS\u00b2:&amp;nbsp;A confec\u00e7\u00e3o da Carta de Arremata\u00e7\u00e3o depender\u00e1 da demanda de trabalho da Vara Judicial respons\u00e1vel, levando, em m\u00e9dia, 90 (noventa) dias \u00fateis para ser expedida, contados a partir da Decis\u00e3o que homologou a arremata\u00e7\u00e3o.&lt;\/u&gt;&lt;\/i&gt;&lt;\/span&gt;&lt;\/p&gt;&quot;,&quot;sequencia&quot;:&quot;2&quot;,&quot;datahora_pregao&quot;:null,&quot;datahora_pregao_segundo_leilao&quot;:null,&quot;datahora_doulheuma&quot;:null,&quot;datahora_doulheduas&quot;:null,&quot;datahora_doulheduas_segundo_leilao&quot;:null,&quot;datahora_vendido&quot;:null,&quot;datahora_condicional&quot;:null,&quot;datahora_naovendido&quot;:null,&quot;datahora_ultimo_repasse&quot;:null,&quot;datahora_retirada&quot;:null,&quot;timer_moderador&quot;:null,&quot;lanceAtual&quot;:&quot;3300&quot;,&quot;proximoLance&quot;:3400,&quot;proximoStatus&quot;:{&quot;timestamp&quot;:null,&quot;texto&quot;:&quot;Aguardando inicio do preg\u00e3o&quot;,&quot;cor&quot;:&quot;primary&quot;},&quot;incrementoLote&quot;:100,&quot;status_lote&quot;:{&quot;id&quot;:1,&quot;nome&quot;:&quot;Aberto&quot;,&quot;cor_site&quot;:&quot;#31CCEC&quot;,&quot;cor_site_venda_direta&quot;:&quot;#BCCF30&quot;,&quot;texto_site&quot;:&quot;Aberto&quot;,&quot;identificador&quot;:&quot;ABERTO&quot;},&quot;imagens_lote&quot;:[{&quot;id&quot;:189971,&quot;id_arquivo&quot;:&quot;1c0b86db-8e25-4a39-ae1b-075aca81f291&quot;,&quot;id_lote&quot;:&quot;102565&quot;,&quot;sequencia&quot;:&quot;0&quot;,&quot;arquivo&quot;:{&quot;id&quot;:&quot;1c0b86db-8e25-4a39-ae1b-075aca81f291&quot;}},{&quot;id&quot;:189970,&quot;id_arquivo&quot;:&quot;ad987cf4-b06e-4193-816c-53b88e0484d5&quot;,&quot;id_lote&quot;:&quot;102565&quot;,&quot;sequencia&quot;:&qu
