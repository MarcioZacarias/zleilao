# =========================================================
# ALTERNATIVO: deploy no servidor compartilhado, por SSH.
#
# O caminho em uso hoje é a Cloudflare (ver cloudflare.yml): a vitrine e a
# API rodam lá, e a coleta roda no computador do operador. Este arquivo fica
# porque o Docker Compose continua válido e é para onde migrar quando o
# tráfego justificar sair do plano gratuito.
# =========================================================
# ZConnect Leilão — deploy no servidor compartilhado (disparo MANUAL).
# ---------------------------------------------------------
# Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PORT (opcional).
# Pre-requisito: /opt/zconnect_leilao clonado, .env preenchido. Ver DEPLOY.md.
# O build do dashboard e' pesado para 1 vCPU: prefira fora do horario comercial.
# =========================================================
name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-zconnect-leilao
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy no servidor
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/zconnect_leilao
            if [ ! -f .env ]; then echo "ERRO: .env ausente. Veja DEPLOY.md."; exit 1; fi
            echo "==> Atualizando codigo"
            git fetch --all --prune
            git reset --hard origin/main
            echo "==> Build e subida do stack"
            docker compose --env-file .env -p zconnect_leilao \
              -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d --build
            echo "==> Aguardando o backend"
            for i in $(seq 1 45); do
              if curl -sf http://127.0.0.1:8005/health >/dev/null 2>&1; then echo "Backend OK"; break; fi
              if [ "$i" = "45" ]; then echo "ERRO: backend nao respondeu"; docker logs --tail 60 zleilao-backend; exit 1; fi
              sleep 2
            done
            curl -sI http://127.0.0.1:5177 | head -1
            docker image prune -f
            echo "==> Deploy concluido"
